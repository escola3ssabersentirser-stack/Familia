<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Família">
<meta name="theme-color" content="#2E2560">
<title>App Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F7F5FF;
    --card:#FFFFFF;
    --ink:#211A3D;
    --ink-soft:#6A6289;
    --ink-faint:#ACA6C7;
    --navy:#2E2560;
    --navy-soft:#E9E5FA;
    --coral:#FF6B4A;
    --coral-soft:#FFE3D9;
    --mint:#1F9E82;
    --mint-soft:#DDF3EC;
    --red:#D6473D;
    --red-soft:#FBDAD7;
    --line:#E7E2F5;
    --radius:22px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; justify-content:center;
  }
  h1,h2,h3{font-family:'Baloo 2',sans-serif; font-weight:600; margin:0;}
  #app{width:100%; max-width:420px; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative;}

  header.top{padding:22px 20px 30px; background:var(--navy); color:#fff; border-radius:0 0 32px 32px; position:relative; overflow:hidden;}
  header.top::after{content:''; position:absolute; right:-30px; top:-30px; width:120px; height:120px; border-radius:50%; background:var(--coral); opacity:.35;}
  header.top .greet{font-size:13px; opacity:.7; margin-bottom:2px; position:relative;}
  header.top h1{font-size:24px; color:#fff; position:relative;}

  .profiles{display:flex; gap:8px; padding:14px 16px 0; margin-top:-16px; overflow-x:auto; position:relative;}
  .profile-chip{flex-shrink:0; display:flex; align-items:center; gap:8px; border:none; background:var(--card); box-shadow:0 4px 14px rgba(46,37,96,.10); border-radius:999px; padding:7px 14px 7px 7px; cursor:pointer; font-size:13px; color:var(--ink-soft);}
  .profile-chip.active{background:var(--coral); color:#fff; font-weight:600;}
  .avatar{width:26px; height:26px; border-radius:50%; background:var(--navy-soft); color:var(--navy); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;}
  .profile-chip.active .avatar{background:rgba(255,255,255,.25); color:#fff;}

  main{flex:1; padding:18px 16px 90px; overflow-y:auto;}
  section{display:none;}
  section.active{display:block;}

  .module-grid{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .mod-card{background:var(--card); border:none; box-shadow:0 3px 12px rgba(46,37,96,.07); border-radius:var(--radius); padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:14px;}
  .mod-card .ic{font-size:20px; display:flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:14px; flex-shrink:0;}
  .mod-card .t{font-size:15px; font-weight:600; font-family:'Baloo 2',sans-serif;}
  .mod-card .s{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .mod-card:nth-child(1) .ic{background:var(--coral-soft);}
  .mod-card:nth-child(2) .ic{background:var(--navy-soft);}
  .mod-card:nth-child(3) .ic{background:var(--mint-soft);}
  .mod-card:nth-child(4) .ic{background:var(--coral-soft);}
  .mod-card:nth-child(5) .ic{background:var(--navy-soft);}

  .card{background:var(--card); border:none; box-shadow:0 3px 12px rgba(46,37,96,.07); border-radius:var(--radius); padding:16px; margin-bottom:12px;}
  .stat-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .stat{background:var(--card); box-shadow:0 3px 12px rgba(46,37,96,.07); border-radius:var(--radius); padding:12px 14px;}
  .stat .label{font-size:12px; color:var(--ink-soft);}
  .stat .value{font-size:21px; font-weight:600; font-family:'Baloo 2',sans-serif;}
  .value.pos{color:var(--mint);} .value.neg{color:var(--coral);}

  .bar-bg{background:var(--line); border-radius:8px; height:8px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:8px;}

  .list-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .left{display:flex; align-items:center; gap:10px;}
  .badge{font-size:11px; padding:2px 9px; border-radius:999px; background:var(--navy-soft); color:var(--navy);}
  .badge.over{background:var(--red-soft); color:var(--red);}

  button.primary{width:100%; background:var(--coral); color:#fff; border:none; border-radius:14px; padding:13px; font-size:14px; font-weight:600; font-family:'Inter',sans-serif; cursor:pointer;}
  button.ghost{width:100%; background:transparent; border:1.5px solid var(--line); color:var(--ink); border-radius:14px; padding:12px; font-size:14px; cursor:pointer; margin-top:8px;}
  input,select{width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px; font-size:14px; font-family:'Inter',sans-serif; margin-bottom:10px; background:#fff; color:var(--ink);}
  label{font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px;}

  .photo-drop{border:2px dashed var(--navy-soft); border-radius:var(--radius); padding:22px; text-align:center; color:var(--ink-soft); font-size:13px; margin-bottom:12px; cursor:pointer;}
  .photo-drop.has-file{border-color:var(--mint); color:var(--mint); background:var(--mint-soft);}

  nav.bottom{position:sticky; bottom:0; background:var(--card); box-shadow:0 -4px 18px rgba(46,37,96,.08); display:flex; justify-content:space-around; padding:10px 4px 14px; border-radius:28px 28px 0 0;}
  nav.bottom button{background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10px; color:var(--ink-faint); cursor:pointer; font-family:'Inter',sans-serif;}
  nav.bottom button.on{color:var(--coral); font-weight:600;}
  nav.bottom .ic{font-size:19px;}

  .task-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .task-row:last-child{border-bottom:none;}
  .task-row input[type=checkbox]{width:18px; height:18px; margin:0; accent-color:var(--coral);}
  .task-row.done .txt{text-decoration:line-through; color:var(--ink-faint);}

  .msg{max-width:78%; padding:9px 13px; border-radius:16px; font-size:14px; margin-bottom:8px;}
  .msg.in{background:var(--navy-soft); color:var(--ink); border-bottom-left-radius:4px;}
  .msg.out{background:var(--coral); color:#fff; margin-left:auto; border-bottom-right-radius:4px;}
  .msg-row{display:flex; gap:8px; margin-top:12px;}
  .msg-row input{margin-bottom:0;}

  .empty{text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13px;}
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="greet" id="greetLine">Bom dia</div>
    <h1 id="profileName">Início</h1>
  </header>

  <div class="profiles" id="profileBar"></div>

  <main>

    <section id="view-home" class="active">
      <div class="module-grid" id="moduleGrid"></div>
    </section>

    <section id="view-comunicacao">
      <div class="card">
        <div id="msgList"></div>
        <div class="msg-row">
          <input id="msgInput" placeholder="Escrever mensagem...">
          <button class="primary" style="width:auto; padding:10px 16px;" onclick="sendMsg()">Enviar</button>
        </div>
      </div>
    </section>

    <section id="view-supervisao">
      <div class="card">
        <label>Tempo de ecrã hoje</label>
        <div class="stat" style="margin-bottom:12px;">
          <div class="value pos" id="screenTimeVal">1h 20m</div>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:44%; background:var(--teal);"></div></div>
        <p style="font-size:12px; color:var(--ink-soft); margin-top:6px;">Limite diário: 3h</p>
      </div>
      <div class="card">
        <h3 style="font-size:15px; margin-bottom:10px;">Apps mais usadas</h3>
        <div class="list-row"><span>YouTube Kids</span><span style="color:var(--ink-soft); font-size:13px;">38 min</span></div>
        <div class="list-row"><span>Jogos educativos</span><span style="color:var(--ink-soft); font-size:13px;">25 min</span></div>
        <div class="list-row"><span>Mensagens</span><span style="color:var(--ink-soft); font-size:13px;">17 min</span></div>
      </div>
    </section>

    <section id="view-rotinas">
      <div class="card" id="taskCard"></div>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <input id="taskInput" placeholder="Nova tarefa..." style="margin-bottom:0;">
        <button class="primary" style="width:auto; padding:10px 16px;" onclick="addTask()">+</button>
      </div>
    </section>

    <section id="view-dinheiro">
      <div class="stat-row">
        <div class="stat"><div class="label">Receitas (mês)</div><div class="value pos" id="incomeVal">0 €</div></div>
        <div class="stat"><div class="label">Gastos (mês)</div><div class="value neg" id="costVal">0 €</div></div>
      </div>

      <div class="card">
        <label id="budgetLabel">Orçamento do mês</label>
        <div class="bar-bg" style="margin-bottom:4px;"><div class="bar-fill" id="budgetBar"></div></div>
        <p style="font-size:12px; color:var(--ink-soft); margin:0;" id="budgetText"></p>
      </div>

      <div class="card">
        <div class="photo-drop" id="photoDrop" onclick="document.getElementById('photoInput').click()">
          <div id="photoDropText">📷 Tirar foto do talão / recibo</div>
        </div>
        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(event)">

        <label>Descrição</label>
        <input id="expDesc" placeholder="Ex.: Supermercado Continente">
        <label>Valor (€)</label>
        <input id="expValue" type="number" step="0.01" placeholder="0,00">
        <label>Rubrica</label>
        <select id="expCat"></select>
        <label>Tipo</label>
        <select id="expType">
          <option value="cost">Despesa</option>
          <option value="income">Receita</option>
        </select>
        <button class="primary" onclick="addExpense()">Adicionar registo</button>
      </div>

      <div class="card">
        <h3 style="font-size:15px; margin-bottom:6px;">Últimos registos</h3>
        <div id="expList"></div>
      </div>
    </section>

    <section id="view-objetivos">
      <div id="goalsList"></div>
      <div class="card">
        <label>Novo objetivo</label>
        <input id="goalTitle" placeholder="Ex.: Comprar uma bicicleta">
        <label>Valor alvo (€) — deixe vazio se não for financeiro</label>
        <input id="goalTarget" type="number" placeholder="0,00">
        <button class="primary" onclick="addGoal()">Criar objetivo</button>
      </div>
    </section>

  </main>

  <nav class="bottom">
    <button data-v="view-home" onclick="goView('view-home')"><span class="ic">🏠</span>Início</button>
    <button data-v="view-comunicacao" onclick="goView('view-comunicacao')"><span class="ic">💬</span>Conversas</button>
    <button data-v="view-supervisao" onclick="goView('view-supervisao')"><span class="ic">🛡️</span>Supervisão</button>
    <button data-v="view-dinheiro" onclick="goView('view-dinheiro')"><span class="ic">💶</span>Dinheiro</button>
    <button data-v="view-objetivos" onclick="goView('view-objetivos')"><span class="ic">🎯</span>Objetivos</button>
  </nav>
</div>

<script>
/* ---------- Dados (partilhados via Supabase) ---------- */
const SUPABASE_URL = 'https://swkcythnxsszjucbuxhb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3a2N5dGhueHNzemp1Y2J1eGhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMzk4NTMsImV4cCI6MjEwNDYxNTg1M30.FMOzLHmEdQUjB06yb71zSTmlJnoReAMZnETfl9ATAls';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let PROFILES = [];
const CATS = ['Casa','Supermercado','Transporte','Saúde','Lazer','Educação','Outros'];

let DATA = { expenses:{}, tasks:{}, goals:{}, messages:{} };
let current = 'vicente';

async function loadProfiles(){
  const {data} = await sb.from('profiles').select('*').order('id');
  PROFILES = (data||[]).map(p=>({id:p.id, name:p.name, age:p.age, private:p.is_private, budget:p.budget}));
}
async function loadProfileData(id){
  const [{data:exp}, {data:tasks}, {data:goals}, {data:msgs}] = await Promise.all([
    sb.from('expenses').select('*').eq('profile_id', id).order('created_at'),
    sb.from('tasks').select('*').eq('profile_id', id).order('created_at'),
    sb.from('goals').select('*').eq('profile_id', id).order('created_at'),
    sb.from('messages').select('*').eq('profile_id', id).order('created_at'),
  ]);
  DATA.expenses[id] = (exp||[]).map(e=>({id:e.id, desc:e.description, value:Number(e.value), cat:e.category, type:e.type, overBudget:e.over_budget}));
  DATA.tasks[id] = (tasks||[]).map(t=>({id:t.id, t:t.title, done:t.done}));
  DATA.goals[id] = (goals||[]).map(g=>({id:g.id, title:g.title, target:Number(g.target), saved:Number(g.saved)}));
  DATA.messages[id] = (msgs||[]).map(m=>({id:m.id, from:m.direction, text:m.text}));
}

/* ---------- Perfis ---------- */
function renderProfileBar(){
  const bar = document.getElementById('profileBar');
  bar.innerHTML = '';
  PROFILES.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'profile-chip' + (p.id===current?' active':'');
    el.onclick = ()=>{ switchProfile(p.id); };
    el.innerHTML = `<span class="avatar">${p.name[0]}</span>${p.name}${p.private?' 🔒':''}`;
    bar.appendChild(el);
  });
}

/* ---------- Home / módulos ---------- */
function renderHome(){
  const p = PROFILES.find(x=>x.id===current);
  document.getElementById('profileName').textContent = p.name;
  document.getElementById('greetLine').textContent = p.id==='voce' ? 'O seu espaço' : 'Perfil de';

  const exp = DATA.expenses[current];
  const costs = exp.filter(e=>e.type==='cost').reduce((a,b)=>a+b.value,0);
  const income = exp.filter(e=>e.type==='income').reduce((a,b)=>a+b.value,0);
  const tasks = DATA.tasks[current];
  const doneT = tasks.filter(t=>t.done).length;
  const goals = DATA.goals[current];
  const g = goals[0];

  const grid = document.getElementById('moduleGrid');
  grid.innerHTML = `
    <div class="mod-card" onclick="goView('view-comunicacao')">
      <span class="ic">💬</span><div class="t">Comunicação</div>
      <div class="s">${DATA.messages[current].length} mensagens</div>
    </div>
    <div class="mod-card" onclick="goView('view-supervisao')">
      <span class="ic">🛡️</span><div class="t">Supervisão</div>
      <div class="s">Ecrã: 1h 20m hoje</div>
    </div>
    <div class="mod-card" onclick="goView('view-rotinas')">
      <span class="ic">✅</span><div class="t">Rotinas</div>
      <div class="s">${doneT} de ${tasks.length} feitas</div>
    </div>
    <div class="mod-card" onclick="goView('view-dinheiro')">
      <span class="ic">💶</span><div class="t">Dinheiro</div>
      <div class="s">Gasto: ${costs.toFixed(0)} €</div>
    </div>
    <div class="mod-card wide" onclick="goView('view-objetivos')">
      <span class="ic">🎯</span><div class="t">Objetivos</div>
      <div class="s">${g ? g.title+' — '+Math.round(g.saved/g.target*100)+'%' : 'Sem objetivos ainda'}</div>
    </div>
  `;
}

/* ---------- Navegação ---------- */
function goView(id){
  document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('on', b.dataset.v===id));
  if(id==='view-dinheiro') renderDinheiro();
  if(id==='view-rotinas') renderTasks();
  if(id==='view-objetivos') renderGoals();
  if(id==='view-comunicacao') renderMsgs();
}

/* ---------- Rotinas ---------- */
function renderTasks(){
  const box = document.getElementById('taskCard');
  const tasks = DATA.tasks[current];
  box.innerHTML = tasks.length ? '' : '<div class="empty">Sem tarefas. Adicione uma abaixo.</div>';
  tasks.forEach((t,i)=>{
    const row = document.createElement('div');
    row.className = 'task-row' + (t.done?' done':'');
    row.innerHTML = `<input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})"><span class="txt">${t.t}</span>`;
    box.appendChild(row);
  });
}
async function toggleTask(i){
  const task = DATA.tasks[current][i];
  task.done = !task.done;
  renderTasks(); renderHome();
  await sb.from('tasks').update({done:task.done}).eq('id', task.id);
}
async function addTask(){
  const inp = document.getElementById('taskInput');
  if(!inp.value.trim()) return;
  const title = inp.value.trim();
  inp.value='';
  const {data} = await sb.from('tasks').insert({profile_id:current, title, done:false}).select().single();
  DATA.tasks[current].push({id:data.id, t:data.title, done:data.done});
  renderTasks(); renderHome();
}

/* ---------- Dinheiro ---------- */
function renderDinheiro(){
  const p = PROFILES.find(x=>x.id===current);
  const catSel = document.getElementById('expCat');
  catSel.innerHTML = CATS.map(c=>`<option>${c}</option>`).join('');

  const exp = DATA.expenses[current];
  const costs = exp.filter(e=>e.type==='cost').reduce((a,b)=>a+b.value,0);
  const income = exp.filter(e=>e.type==='income').reduce((a,b)=>a+b.value,0);
  document.getElementById('incomeVal').textContent = income.toFixed(0)+' €';
  document.getElementById('costVal').textContent = costs.toFixed(0)+' €';

  const budget = p.budget || 0;
  const pct = budget ? Math.min(100, Math.round(costs/budget*100)) : 0;
  document.getElementById('budgetLabel').textContent = budget ? `Orçamento do mês — ${budget} €` : 'Sem orçamento definido';
  document.getElementById('budgetBar').style.width = pct+'%';
  document.getElementById('budgetBar').style.background = pct>90 ? 'var(--coral)' : 'var(--teal)';
  document.getElementById('budgetText').textContent = budget
    ? (costs>budget ? `Já ultrapassou o orçamento em ${(costs-budget).toFixed(0)} €` : `${pct}% do orçamento usado`)
    : 'Defina um orçamento para ver alertas de excesso.';

  const list = document.getElementById('expList');
  list.innerHTML = exp.length ? '' : '<div class="empty">Ainda sem registos.</div>';
  exp.slice().reverse().forEach(e=>{
    const row = document.createElement('div');
    row.className = 'list-row';
    row.innerHTML = `<div class="left"><span class="badge${e.overBudget?' over':''}">${e.cat||'—'}</span><span>${e.desc}</span></div><span style="color:${e.type==='income'?'var(--teal)':'var(--coral)'}">${e.type==='income'?'+':'-'}${e.value.toFixed(2)} €</span>`;
    list.appendChild(row);
  });
}
function onPhoto(ev){
  const f = ev.target.files[0];
  const drop = document.getElementById('photoDrop');
  const txt = document.getElementById('photoDropText');
  if(f){
    drop.classList.add('has-file');
    txt.textContent = '✓ Foto anexada — confirme os dados abaixo';
  }
}
async function addExpense(){
  const desc = document.getElementById('expDesc').value.trim();
  const value = parseFloat(document.getElementById('expValue').value);
  const cat = document.getElementById('expCat').value;
  const type = document.getElementById('expType').value;
  if(!desc || !value){ alert('Preencha a descrição e o valor.'); return; }
  const p = PROFILES.find(x=>x.id===current);
  const costsBefore = DATA.expenses[current].filter(e=>e.type==='cost').reduce((a,b)=>a+b.value,0);
  const overBudget = type==='cost' && p.budget && (costsBefore+value) > p.budget;
  document.getElementById('expDesc').value='';
  document.getElementById('expValue').value='';
  document.getElementById('photoDrop').classList.remove('has-file');
  document.getElementById('photoDropText').textContent = '📷 Tirar foto do talão / recibo';
  const {data} = await sb.from('expenses').insert({profile_id:current, description:desc, value, category:cat, type, over_budget:overBudget}).select().single();
  DATA.expenses[current].push({id:data.id, desc:data.description, value:Number(data.value), cat:data.category, type:data.type, overBudget:data.over_budget});
  renderDinheiro(); renderHome();
}

/* ---------- Objetivos ---------- */
function renderGoals(){
  const box = document.getElementById('goalsList');
  const goals = DATA.goals[current];
  box.innerHTML = goals.length ? '' : '<div class="empty">Ainda sem objetivos.</div>';
  goals.forEach(g=>{
    const pct = Math.min(100, Math.round(g.saved/g.target*100));
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3 style="font-size:15px; margin-bottom:8px;">${g.title}</h3>
      <div class="bar-bg" style="margin-bottom:6px;"><div class="bar-fill" style="width:${pct}%; background:var(--amber);"></div></div>
      <p style="font-size:12px; color:var(--ink-soft); margin:0;">${g.saved} € de ${g.target} € — ${pct}%</p>
    `;
    box.appendChild(card);
  });
}
async function addGoal(){
  const title = document.getElementById('goalTitle').value.trim();
  const target = parseFloat(document.getElementById('goalTarget').value) || 100;
  if(!title) return;
  document.getElementById('goalTitle').value='';
  document.getElementById('goalTarget').value='';
  const {data} = await sb.from('goals').insert({profile_id:current, title, target, saved:0}).select().single();
  DATA.goals[current].push({id:data.id, title:data.title, target:Number(data.target), saved:Number(data.saved)});
  renderGoals(); renderHome();
}

/* ---------- Comunicação ---------- */
function renderMsgs(){
  const box = document.getElementById('msgList');
  const msgs = DATA.messages[current];
  box.innerHTML = msgs.length ? '' : '<div class="empty">Ainda sem mensagens.</div>';
  msgs.forEach(m=>{
    const el = document.createElement('div');
    el.className = 'msg ' + m.from;
    el.textContent = m.text;
    box.appendChild(el);
  });
  box.scrollTop = box.scrollHeight;
}
async function sendMsg(){
  const inp = document.getElementById('msgInput');
  if(!inp.value.trim()) return;
  const text = inp.value.trim();
  inp.value='';
  const {data} = await sb.from('messages').insert({profile_id:current, direction:'out', text}).select().single();
  DATA.messages[current].push({id:data.id, from:data.direction, text:data.text});
  renderMsgs(); renderHome();
}

/* ---------- Init ---------- */
async function switchProfile(id){
  current = id;
  renderProfileBar();
  await loadProfileData(current);
  renderHome();
  goView('view-home');
}
async function renderAll(){
  await loadProfiles();
  if(!PROFILES.find(p=>p.id===current) && PROFILES.length) current = PROFILES[0].id;
  await loadProfileData(current);
  renderProfileBar();
  renderHome();
  goView('view-home');
}
renderAll();
</script>
</body>
</html>
